<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="100%" fill="none" role="img" aria-label="AI system flow: user request, application, retrieval, LLM and tools, structured result, validation, useful output, with a retry and human review branch" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070B14"/>
      <stop offset="55%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1A2540"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="60%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 H 0 V 40" stroke="#1E293B" stroke-width="0.6" opacity="0.5"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#94A3B8"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L8,4 L0,8 Z" fill="#F59E0B"/>
    </marker>
  </defs>

  <style>
    text { font-family: 'JetBrains Mono', 'Fira Code', 'SFMono-Regular', Consolas, 'Courier New', monospace; }
    .t { font-size: 15px; font-weight: 700; fill: #F8FAFC; text-anchor: middle; }
    .s { font-size: 11px; font-weight: 500; fill: #94A3B8; text-anchor: middle; }
    .n { font-size: 11px; font-weight: 700; }
    @keyframes flow { to { stroke-dashoffset: -16; } }
    .flow { stroke-dasharray: 5 3; animation: flow 1s linear infinite; }
  </style>

  <!-- Background -->
  <rect x="1" y="1" width="1198" height="478" rx="14" fill="url(#bg)" stroke="#334155" stroke-width="2"/>
  <rect x="1" y="1" width="1198" height="478" rx="14" fill="url(#grid)"/>

  <!-- Header -->
  <text x="50" y="40" font-size="13" font-weight="700" fill="#94A3B8">// HOW I THINK ABOUT AI SYSTEMS</text>
  <rect x="50" y="50" width="180" height="2" rx="1" fill="url(#accent)"/>

  <!-- Knowledge source -->
  <rect x="645" y="58" width="200" height="34" rx="17" fill="#0B1220" stroke="#38BDF8" stroke-width="1.5"/>
  <text x="745" y="80" class="s" style="fill:#38BDF8;font-weight:700;font-size:12px">Relevant knowledge</text>
  <line x1="745" y1="93" x2="745" y2="114" stroke="#38BDF8" stroke-width="1.5" class="flow" marker-end="url(#arrow)"/>

  <!-- Row 1 -->
  <g>
    <rect x="50" y="116" width="230" height="76" rx="10" fill="#0F172A" stroke="#94A3B8" stroke-width="1.5"/>
    <text x="66" y="136" class="n" fill="#94A3B8">01</text>
    <text x="165" y="160" class="t">User request</text>
    <text x="165" y="178" class="s">question or task</text>
  </g>
  <g>
    <rect x="340" y="116" width="230" height="76" rx="10" fill="#0F172A" stroke="#38BDF8" stroke-width="1.5"/>
    <text x="356" y="136" class="n" fill="#38BDF8">02</text>
    <text x="455" y="160" class="t">Application &amp; API</text>
    <text x="455" y="178" class="s">request handling</text>
  </g>
  <g>
    <rect x="630" y="116" width="230" height="76" rx="10" fill="#0F172A" stroke="#38BDF8" stroke-width="1.5"/>
    <text x="646" y="136" class="n" fill="#38BDF8">03</text>
    <text x="745" y="160" class="t">Context &amp; retrieval</text>
    <text x="745" y="178" class="s">RAG · vector search</text>
  </g>
  <g>
    <rect x="920" y="116" width="230" height="76" rx="10" fill="#0F172A" stroke="#C084FC" stroke-width="1.5"/>
    <text x="936" y="136" class="n" fill="#C084FC">04</text>
    <text x="1035" y="160" class="t">LLM + tools</text>
    <text x="1035" y="178" class="s">reasoning · tool calls</text>
  </g>

  <!-- Row 1 arrows -->
  <line x1="282" y1="154" x2="338" y2="154" stroke="#94A3B8" stroke-width="1.5" class="flow" marker-end="url(#arrow)"/>
  <line x1="572" y1="154" x2="628" y2="154" stroke="#94A3B8" stroke-width="1.5" class="flow" marker-end="url(#arrow)"/>
  <line x1="862" y1="154" x2="918" y2="154" stroke="#94A3B8" stroke-width="1.5" class="flow" marker-end="url(#arrow)"/>

  <!-- Down arrow -->
  <line x1="1035" y1="194" x2="1035" y2="278" stroke="#94A3B8" stroke-width="1.5" class="flow" marker-end="url(#arrow)"/>

  <!-- Row 2 -->
  <g>
    <rect x="920" y="280" width="230" height="76" rx="10" fill="#0F172A" stroke="#C084FC" stroke-width="1.5"/>
    <text x="936" y="300" class="n" fill="#C084FC">05</text>
    <text x="1035" y="324" class="t">Structured result</text>
    <text x="1035" y="342" class="s">JSON · schema</text>
  </g>
  <g>
    <rect x="630" y="280" width="230" height="76" rx="10" fill="#0F172A" stroke="#10B981" stroke-width="1.5"/>
    <text x="646" y="300" class="n" fill="#10B981">06</text>
    <text x="745" y="324" class="t">Validation &amp; rules</text>
    <text x="745" y="342" class="s">schema checks · logic</text>
  </g>
  <g>
    <rect x="340" y="280" width="230" height="76" rx="10" fill="#0F172A" stroke="#10B981" stroke-width="1.5"/>
    <text x="356" y="300" class="n" fill="#10B981">07</text>
    <text x="455" y="324" class="t">Useful output</text>
    <text x="455" y="342" class="s">logged · observable</text>
  </g>

  <!-- Row 2 arrows (right to left) -->
  <line x1="918" y1="318" x2="862" y2="318" stroke="#94A3B8" stroke-width="1.5" class="flow" marker-end="url(#arrow)"/>
  <line x1="628" y1="318" x2="572" y2="318" stroke="#94A3B8" stroke-width="1.5" class="flow" marker-end="url(#arrow)"/>

  <!-- Failure branch -->
  <line x1="745" y1="358" x2="745" y2="394" stroke="#F59E0B" stroke-width="1.5" class="flow" marker-end="url(#arrow-amber)"/>
  <text x="757" y="381" font-size="11" font-weight="600" fill="#F59E0B">failure or low confidence</text>
  <rect x="605" y="396" width="280" height="50" rx="10" fill="#0F172A" stroke="#F59E0B" stroke-width="1.5" stroke-dasharray="5 3"/>
  <text x="745" y="418" class="t" style="font-size:14px">Retry · fallback</text>
  <text x="745" y="436" class="s">or human review</text>

  <!-- Principle -->
  <text x="50" y="312" font-size="15" font-weight="800" fill="#38BDF8">AI for reasoning.</text>
  <text x="50" y="336" font-size="15" font-weight="800" fill="#10B981">Code for reliability.</text>

  <!-- Legend -->
  <circle cx="55" cy="428" r="5" fill="#38BDF8"/>
  <text x="67" y="432" font-size="11" fill="#94A3B8">Data and retrieval</text>
  <circle cx="205" cy="428" r="5" fill="#C084FC"/>
  <text x="217" y="432" font-size="11" fill="#94A3B8">Model</text>
  <circle cx="290" cy="428" r="5" fill="#10B981"/>
  <text x="302" y="432" font-size="11" fill="#94A3B8">Deterministic code</text>
</svg>
