<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="100%" height="300" fill="none" role="img" aria-label="Ajay Kumar B — AI Application Engineer" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070B14"/>
      <stop offset="55%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1A2540"/>
    </linearGradient>
    <linearGradient id="titlebar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="60%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>
    <radialGradient id="glow-left" cx="0%" cy="100%" r="70%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-right" cx="100%" cy="0%" r="60%">
      <stop offset="0%" stop-color="#C084FC" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#C084FC" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 H 0 V 40" stroke="#1E293B" stroke-width="0.6" opacity="0.5"/>
    </pattern>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="window-clip">
      <rect width="1200" height="300" rx="14"/>
    </clipPath>
  </defs>

  <style>
    text { font-family: 'JetBrains Mono', 'Fira Code', 'SFMono-Regular', Consolas, 'Courier New', monospace; }
    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
    @keyframes draw { from { stroke-dashoffset: 560; } to { stroke-dashoffset: 0; } }
    @keyframes scan { 0% { transform: translateY(-20px); opacity: 0; } 20% { opacity: .35; } 80% { opacity: .35; } 100% { transform: translateY(300px); opacity: 0; } }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .35; } }
    @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    .cursor { animation: blink 1s steps(1) infinite; }
    .underline { stroke-dasharray: 560; stroke-dashoffset: 560; animation: draw 1.8s ease-out .3s forwards; }
    .scan { animation: scan 5s linear infinite; }
    .dot { animation: pulse 1.8s ease-in-out infinite; }
    .row { opacity: 0; animation: rise .6s ease-out forwards; }
    .r1 { animation-delay: .5s; } .r2 { animation-delay: .7s; } .r3 { animation-delay: .9s; }
    .r4 { animation-delay: 1.1s; } .r5 { animation-delay: 1.3s; }
  </style>

  <g clip-path="url(#window-clip)">
    <!-- Background -->
    <rect width="1200" height="300" fill="url(#bg)"/>
    <rect width="1200" height="300" fill="url(#grid)"/>
    <rect width="1200" height="300" fill="url(#glow-left)"/>
    <rect width="1200" height="300" fill="url(#glow-right)"/>

    <!-- Scanning beam -->
    <rect x="0" y="0" width="1200" height="4" fill="url(#accent)" class="scan" filter="url(#glow)"/>

    <!-- Title bar -->
    <rect width="1200" height="42" fill="url(#titlebar)"/>
    <line x1="0" y1="42" x2="1200" y2="42" stroke="#334155" stroke-width="1"/>
    <circle cx="28" cy="21" r="6" fill="#EF4444"/>
    <circle cx="48" cy="21" r="6" fill="#F59E0B"/>
    <circle cx="68" cy="21" r="6" fill="#10B981"/>
    <text x="600" y="26" font-size="13" font-weight="600" fill="#94A3B8" text-anchor="middle">ajay@ai-engineering: ~/portfolio</text>
  </g>

  <!-- Window border -->
  <rect x="1" y="1" width="1198" height="298" rx="13" stroke="#334155" stroke-width="2"/>

  <!-- Prompt -->
  <text x="40" y="78" font-size="14" font-weight="700">
    <tspan fill="#10B981">ajay@ai-engineering</tspan><tspan fill="#94A3B8">:</tspan><tspan fill="#38BDF8">~</tspan><tspan fill="#F8FAFC"> $ ./initialize_ai_engineer.sh --mode=build</tspan><tspan fill="#38BDF8" class="cursor"> █</tspan>
  </text>

  <!-- Name -->
  <text x="40" y="138" font-size="40" font-weight="800" fill="#FFFFFF" letter-spacing="1.5">AJAY KUMAR B</text>
  <path d="M 40 153 H 560" stroke="url(#accent)" stroke-width="3" stroke-linecap="round" filter="url(#glow)" class="underline"/>

  <!-- Role + tagline -->
  <text x="40" y="188" font-size="18" font-weight="700" fill="#38BDF8" letter-spacing="1">AI APPLICATION ENGINEER</text>
  <text x="40" y="214" font-size="13.5" font-weight="500" fill="#94A3B8">Building useful AI applications — not just model demos.</text>

  <!-- Technology pills -->
  <g transform="translate(40, 240)">
    <rect x="0" y="0" width="70" height="26" rx="6" fill="#0F172A" stroke="#38BDF8" stroke-width="1"/>
    <text x="35" y="17" font-size="11" font-weight="700" fill="#38BDF8" text-anchor="middle">LLMs</text>

    <rect x="80" y="0" width="70" height="26" rx="6" fill="#0F172A" stroke="#38BDF8" stroke-width="1"/>
    <text x="115" y="17" font-size="11" font-weight="700" fill="#38BDF8" text-anchor="middle">RAG</text>

    <rect x="160" y="0" width="94" height="26" rx="6" fill="#0F172A" stroke="#818CF8" stroke-width="1"/>
    <text x="207" y="17" font-size="11" font-weight="700" fill="#818CF8" text-anchor="middle">AI AGENTS</text>

    <rect x="264" y="0" width="80" height="26" rx="6" fill="#0F172A" stroke="#818CF8" stroke-width="1"/>
    <text x="304" y="17" font-size="11" font-weight="700" fill="#818CF8" text-anchor="middle">FASTAPI</text>

    <rect x="354" y="0" width="104" height="26" rx="6" fill="#0F172A" stroke="#C084FC" stroke-width="1"/>
    <text x="406" y="17" font-size="11" font-weight="700" fill="#C084FC" text-anchor="middle">AUTOMATION</text>

    <rect x="468" y="0" width="106" height="26" rx="6" fill="#0F172A" stroke="#C084FC" stroke-width="1"/>
    <text x="521" y="17" font-size="11" font-weight="700" fill="#C084FC" text-anchor="middle">CLAUDE CODE</text>
  </g>

  <!-- Right status panel -->
  <g transform="translate(760, 62)">
    <rect width="400" height="200" rx="10" fill="#0B1220" stroke="#243247" stroke-width="1.5"/>
    <circle cx="22" cy="26" r="4" fill="#10B981" class="dot"/>
    <text x="36" y="30" font-size="12" font-weight="700" fill="#94A3B8">// AI APPLICATION STACK</text>
    <text x="378" y="30" font-size="11" font-weight="600" fill="#10B981" text-anchor="end">ONLINE</text>
    <line x1="20" y1="44" x2="380" y2="44" stroke="#1E293B" stroke-width="1"/>

    <g class="row r1">
      <text x="20" y="74" font-size="12" font-weight="700" fill="#F8FAFC">LLMs</text>
      <text x="130" y="74" font-size="12" font-weight="600" fill="#38BDF8">GPT • Gemini • Claude</text>
    </g>
    <g class="row r2">
      <text x="20" y="102" font-size="12" font-weight="700" fill="#F8FAFC">RETRIEVAL</text>
      <text x="130" y="102" font-size="12" font-weight="600" fill="#38BDF8">RAG • Embeddings • Vector Search</text>
    </g>
    <g class="row r3">
      <text x="20" y="130" font-size="12" font-weight="700" fill="#F8FAFC">AGENTS</text>
      <text x="130" y="130" font-size="12" font-weight="600" fill="#38BDF8">Tool Calling • Workflows</text>
    </g>
    <g class="row r4">
      <text x="20" y="158" font-size="12" font-weight="700" fill="#F8FAFC">BACKEND</text>
      <text x="130" y="158" font-size="12" font-weight="600" fill="#38BDF8">Python • FastAPI • REST</text>
    </g>
    <g class="row r5">
      <text x="20" y="186" font-size="12" font-weight="700" fill="#F8FAFC">DATA</text>
      <text x="130" y="186" font-size="12" font-weight="600" fill="#38BDF8">PostgreSQL • MySQL • pandas</text>
    </g>
  </g>
</svg>
