<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="100%" height="280" fill="none">
  <defs>
    <linearGradient id="terminal-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C14"/>
      <stop offset="50%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>

    <linearGradient id="titlebar-bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>

    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="50%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>

    <filter id="neon-glow-filter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes blinkCursor {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    @keyframes lineFlow {
      0% { stroke-dashoffset: 600; }
      100% { stroke-dashoffset: 0; }
    }

    @keyframes scanlinePulse {
      0% { transform: translateY(-50px); opacity: 0; }
      30% { opacity: 0.25; }
      70% { opacity: 0.25; }
      100% { transform: translateY(280px); opacity: 0; }
    }

    .cursor-blink {
      animation: blinkCursor 0.9s infinite;
    }

    .flowing-line {
      stroke-dasharray: 600;
      stroke-dashoffset: 600;
      animation: lineFlow 2.5s ease-out forwards;
    }

    .scanner-beam {
      animation: scanlinePulse 4.5s linear infinite;
    }
  </style>

  <!-- Outer Window -->
  <rect
    width="1200"
    height="280"
    rx="14"
    fill="url(#terminal-bg)"
    stroke="#334155"
    stroke-width="2"
  />

  <!-- Scanning Beam -->
  <rect
    x="0"
    y="0"
    width="1200"
    height="8"
    fill="url(#cyan-glow)"
    class="scanner-beam"
    filter="url(#neon-glow-filter)"
    opacity="0.3"
  />

  <!-- Titlebar -->
  <path
    d="M 0,14
       C 0,6.268 6.268,0 14,0
       H 1186
       C 1193.73,0 1200,6.268 1200,14
       V 42
       H 0 Z"
    fill="url(#titlebar-bg)"
    stroke="#334155"
    stroke-width="1"
  />

  <!-- Window Buttons -->
  <circle cx="28" cy="21" r="6" fill="#EF4444"/>
  <circle cx="48" cy="21" r="6" fill="#F59E0B"/>
  <circle cx="68" cy="21" r="6" fill="#10B981"/>

  <!-- Terminal Title -->
  <text
    x="600"
    y="26"
    font-family="'JetBrains Mono', 'Fira Code', monospace"
    font-size="13"
    font-weight="600"
    fill="#94A3B8"
    text-anchor="middle"
  >
    ajay@ai-engineering:~ (zsh)
  </text>

  <!-- Command -->
  <g transform="translate(40, 75)">
    <text
      font-family="'JetBrains Mono', monospace"
      font-size="14"
      font-weight="700"
    >
      <tspan fill="#10B981">ajay@ai-engineering</tspan>
      <tspan fill="#94A3B8">:</tspan>
      <tspan fill="#38BDF8">~</tspan>
      <tspan fill="#F8FAFC"> $ ./initialize_ai_engineer.sh --mode=build</tspan>
    </text>

    <rect
      x="500"
      y="-12"
      width="9"
      height="16"
      fill="#38BDF8"
      class="cursor-blink"
    />
  </g>

  <!-- Name -->
  <text
    x="40"
    y="132"
    font-family="'JetBrains Mono', 'Fira Code', monospace"
    font-size="38"
    font-weight="800"
    fill="#FFFFFF"
    letter-spacing="1.5"
  >
    AJAY KUMAR B
  </text>

  <!-- Animated Underline -->
  <path
    d="M 40,145 H 580"
    stroke="url(#cyan-glow)"
    stroke-width="3"
    filter="url(#neon-glow-filter)"
    class="flowing-line"
  />

  <!-- Role -->
  <text
    x="40"
    y="178"
    font-family="'JetBrains Mono', monospace"
    font-size="17"
    font-weight="700"
    fill="#38BDF8"
    letter-spacing="0.8"
  >
    AI APPLICATION ENGINEER
    <tspan fill="#64748B"> | </tspan>
    AI SYSTEMS
  </text>

  <!-- Description -->
  <text
    x="40"
    y="204"
    font-family="'JetBrains Mono', monospace"
    font-size="14"
    font-weight="500"
    fill="#94A3B8"
  >
    LLMs • RAG • AI AGENTS • APIs • AUTOMATION
  </text>

  <!-- Right Status Panel -->
  <g transform="translate(820, 68)">

    <rect
      width="340"
      height="175"
      rx="10"
      fill="#0F172A"
      stroke="#1E293B"
      stroke-width="1.5"
    />

    <!-- Header -->
    <text
      x="20"
      y="32"
      font-family="'JetBrains Mono', monospace"
      font-size="12"
      font-weight="700"
      fill="#94A3B8"
    >
      // AI APPLICATION STACK
    </text>

    <line
      x1="20"
      y1="42"
      x2="320"
      y2="42"
      stroke="#1E293B"
      stroke-width="1"
    />

    <!-- Stack -->
    <text
      x="20"
      y="74"
      font-family="'JetBrains Mono', monospace"
      font-size="12"
      font-weight="600"
      fill="#F8FAFC"
    >
      LLMs:
      <tspan fill="#38BDF8"> GPT • Gemini • Claude</tspan>
    </text>

    <text
      x="20"
      y="104"
      font-family="'JetBrains Mono', monospace"
      font-size="12"
      font-weight="600"
      fill="#F8FAFC"
    >
      RETRIEVAL:
      <tspan fill="#38BDF8"> RAG • Vector Search</tspan>
    </text>

    <text
      x="20"
      y="134"
      font-family="'JetBrains Mono', monospace"
      font-size="12"
      font-weight="600"
      fill="#F8FAFC"
    >
      AGENTS:
      <tspan fill="#38BDF8"> Tools • Workflows</tspan>
    </text>

    <text
      x="20"
      y="164"
      font-family="'JetBrains Mono', monospace"
      font-size="12"
      font-weight="600"
      fill="#F8FAFC"
    >
      BACKEND:
      <tspan fill="#38BDF8"> Python • FastAPI</tspan>
    </text>

  </g>

  <!-- Technology Pills -->
  <g transform="translate(40, 222)">

    <rect
      x="0" y="0"
      width="75" height="24"
      rx="5"
      fill="#0F172A"
      stroke="#38BDF8"
      stroke-width="1"
    />

    <text
      x="37.5"
      y="16"
      font-family="'JetBrains Mono', monospace"
      font-size="11"
      font-weight="700"
      fill="#38BDF8"
      text-anchor="middle"
    >
      LLMs
    </text>

    <rect
      x="85" y="0"
      width="110" height="24"
      rx="5"
      fill="#0F172A"
      stroke="#38BDF8"
      stroke-width="1"
    />

    <text
      x="140"
      y="16"
      font-family="'JetBrains Mono', monospace"
      font-size="11"
      font-weight="700"
      fill="#38BDF8"
      text-anchor="middle"
    >
      RAG SYSTEMS
    </text>

    <rect
      x="205" y="0"
      width="125" height="24"
      rx="5"
      fill="#0F172A"
      stroke="#38BDF8"
      stroke-width="1"
    />

    <text
      x="267.5"
      y="16"
      font-family="'JetBrains Mono', monospace"
      font-size="11"
      font-weight="700"
      fill="#38BDF8"
      text-anchor="middle"
    >
      AI AGENTS
    </text>

    <rect
      x="340" y="0"
      width="90" height="24"
      rx="5"
      fill="#0F172A"
      stroke="#38BDF8"
      stroke-width="1"
    />

    <text
      x="385"
      y="16"
      font-family="'JetBrains Mono', monospace"
      font-size="11"
      font-weight="700"
      fill="#38BDF8"
      text-anchor="middle"
    >
      FASTAPI
    </text>

    <rect
      x="440" y="0"
      width="125" height="24"
      rx="5"
      fill="#0F172A"
      stroke="#38BDF8"
      stroke-width="1"
    />

    <text
      x="502.5"
      y="16"
      font-family="'JetBrains Mono', monospace"
      font-size="11"
      font-weight="700"
      fill="#38BDF8"
      text-anchor="middle"
    >
      CLAUDE CODE
    </text>

  </g>

</svg>
